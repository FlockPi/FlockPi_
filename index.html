<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FlockPi – Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
   <link rel="icon" type="image/x-icon" href="/favicon.png">
  <style>
    :root {
      --bg: #05060a;
      --accent: #4fd1ff;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020617 45%, #000 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrapper {
      max-width: 640px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
    }

    .logo-row {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .logo-row img {
      height: 56px;
      width: auto;
      border-radius: 12px;
      text-align: center;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .logo-text span {
      color: var(--accent);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    p.lead {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(79, 209, 255, 0.08);
      border: 1px solid rgba(79, 209, 255, 0.35);
      color: var(--accent);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.9);
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 18px;
    }

    input[type="email"] {
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      min-width: 220px;
      max-width: 280px;
      outline: none;
      font-size: 14px;
    }

    input[type="email"]::placeholder {
      color: #6b7280;
    }

    button {
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #4fd1ff, #6366f1);
      color: #0b1020;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(79, 209, 255, 0.35);
    }

    button:hover {
      filter: brightness(1.08);
    }

    .footnote {
      font-size: 12px;
      color: #6b7280;
    }

    .footnote a {
      color: var(--accent);
      text-decoration: none;
    }

    .footnote a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="logo-row">
      <!-- Replace src with your actual logo file path -->
      <img src="flockpi-logo.png" style="width: 100%; height: auto;" alt="FlockPi logo" />
    </div>
    <br><br>
    <div class="pill">
      <span class="pill-dot"></span>
      <span>Private beta flocking together soon</span>
    </div>

    <h1>We’re building the next wave of collaborative intelligence.</h1>
    <p class="lead">
      FlockPi connects you into one living system, so your surveillance awareness toolkit
      can move as fast as you think.
    </p>

    <footer id="footer" style="font-family: Verdana, Geneva, Tahoma, sans-serif;font-size: 12px;color: white;">
        <center>©<script>new Date().getFullYear()>2010&&document.write(""+new Date().getFullYear());</script> FlockPi
        </center>
    </footer>

  </div>



</body>

</html>
